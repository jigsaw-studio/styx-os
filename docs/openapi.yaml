  /v1/matrix:
    get:
      summary: Retrieve sorted traffic summary by domain or IP
      description: |-
        Retrieves a sorted summary of network traffic grouped by domain name (if available) or remote IP address. 
        Each entry includes:

        - **Address:** The domain name if known, otherwise the remote IP (optionally with port).
        - **Sent:** Total bytes sent to this address.
        - **Received:** Total bytes received from this address.
        - **Count:** The number of times this address was accessed.

        Results are ordered by **highest access count**.

        **Query Parameters:**
        - `start_date`: Start date filter (`YYYY-MM-DD`).
        - `start_time`: Start time filter (`HH:MM:SS`).
        - `end_date`: End date filter (`YYYY-MM-DD`).
        - `end_time`: End time filter (`HH:MM:SS`).
        - `relative`: Relative time range (e.g., `60s`, `30m`, `1h`).
        - `timezone`: Timezone for timestamps (e.g., `UTC`, `America/New_York`).
        - `client`: Filter by a specific local IP.

        **Example Response:**
        ```json
        [
          {
            "address": "example.com:443",
            "sent": 12345,
            "received": 67890,
            "count": 42
          },
          {
            "address": "192.168.1.100:80",
            "sent": 5120,
            "received": 10240,
            "count": 18
          }
        ]
        ```
      operationId: get_matrix_summary_v1_matrix_get
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Start Date
        - name: start_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Start Time
        - name: end_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: End Date
        - name: end_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: End Time
        - name: relative
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Relative
        - name: timezone
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Timezone
        - name: client
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Client
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
